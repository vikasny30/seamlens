openapi: 3.0.3
info:
  title: Shop API
  version: "1.0"
paths:
  /orders:
    get:
      summary: List orders
      operationId: listOrders
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "500":
          description: boom
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorA"
    post:
      summary: Create order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                items:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}:
    get:
      summary: Get order
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorB"
    delete:
      summary: Cancel order
      operationId: getOrder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "204":
          description: gone
  /users/getProfile:
    get:
      summary: Profile
      responses:
        "200":
          description: ok
  /refunds:
    post:
      summary: Refund a payment
      operationId: createRefund
      responses:
        "201":
          description: refunded
components:
  schemas:
    Order:
      type: object
      properties:
        order_id:
          type: string
        customerId:
          type: string
        total_price:
          type: number
        createdAt:
          type: string
    ErrorA:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
    ErrorB:
      type: object
      properties:
        error: { type: string }
