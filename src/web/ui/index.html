<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeamLens</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><b>SeamLens</b><span id="repo" class="mut"></span></div>
  <nav id="tabs" role="tablist" aria-label="Views"></nav>
  <div class="grow"></div>
  <div id="score" class="score" title="Contract health"></div>
  <button id="rescan" class="btn" title="Scan the repository again">Rescan</button>
</header>
<main id="main"><div class="empty">Scanning the repository…</div></main>
<aside id="drawer" class="drawer" hidden aria-label="File viewer"></aside>
<div id="toast" aria-live="polite"></div>
<script src="/app.js" defer></script>
</body>
</html>
